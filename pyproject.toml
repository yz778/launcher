[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "launcher"
version = "1.0.0"
authors = [{ name = "yz778" }]
description = "GTK Launcher"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: GTK",
    "Environment :: Wayland",
]
dependencies = [
    "pycairo==1.29.0",
    "PyGObject==3.54.2",
    "pyperclip==1.11.0",
    "pytz==2025.2",
    "pyxdg==0.28",
    "xdg-base-dirs==6.0.3",
]

[project.urls]
Homepage = "https://github.com/yz778/launcher"

[project.scripts]
launcher = "launcher.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["launcher*"]
